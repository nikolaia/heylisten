# heyListen config. Every setting is optional; delete a line to get the default back.
# Run `heylisten doctor` after editing.

# Where meeting notes (.md files) are written.
notes_dir = "~/Desktop"

# NB-Whisper model used for transcription. `heylisten setup` downloads it to
# heyListen's models folder, which is the default.
# whisper_model = "~/models/nb-whisper-large-q5_0.bin"

# Ollama model used for the summary.
ollama_model = "hf.co/NbAiLab/borealis-12b-gguf"

# Keep this on localhost. Anything else sends transcripts off this machine.
ollama_url = "http://localhost:11434"

# Keep the recorded audio after the note is written.
keep_audio = false
