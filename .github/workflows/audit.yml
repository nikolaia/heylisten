# Checks the dependencies against the RustSec advisory database every day, so a new advisory
# shows up the day it's published instead of failing the next unrelated push.
#
# Every action is pinned to a full commit SHA, so a moved tag can't change what runs here.
name: Audit

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Audit dependencies for known vulnerabilities
        run: |
          cargo install cargo-audit --locked
          cargo audit
