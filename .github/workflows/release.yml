# Builds heyListen.app for Apple Silicon. On a v* tag it's attached to a GitHub Release;
# a manual run just uploads it as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cmake
        run: command -v cmake || brew install cmake
      - name: Test
        run: cargo test
      - name: Build heyListen.app
        run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: heyListen-macos-arm64
          path: target/heyListen-macos-arm64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/heyListen-macos-arm64.zip
          generate_release_notes: true
