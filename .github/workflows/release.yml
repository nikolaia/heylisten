# Tests, audits dependencies and builds heyListen.app for Apple Silicon on every push and pull
# request. On a v* tag it also publishes a GitHub Release with the zip, its SHA-256 and a signed
# build-provenance attestation (verify with: gh attestation verify <zip> --repo nikolaia/heylisten).
#
# Every action is pinned to a full commit SHA, so a moved tag can't change what runs here.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write # create the release (tags only)
      id-token: write # sign the attestation (tags only)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cmake
        run: command -v cmake || brew install cmake

      - name: Test
        run: cargo test --locked
      - name: Audit dependencies for known vulnerabilities
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build heyListen.app
        run: scripts/bundle-macos.sh
      - name: Checksum
        run: cd target && shasum -a 256 heyListen-macos-arm64.zip | tee SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heyListen-macos-arm64
          path: |
            target/heyListen-macos-arm64.zip
            target/SHA256SUMS

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/heyListen-macos-arm64.zip
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # The section for this version, without its heading; no section, no release.
          awk -v v="${VERSION#v}" '$0 ~ "^## \\[" {on = index($0, "## [" v "]") == 1; next} /^\[[^]]+\]: / {next} on' CHANGELOG.md > target/NOTES.md
          test -s target/NOTES.md || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            target/heyListen-macos-arm64.zip
            target/SHA256SUMS
          body_path: target/NOTES.md
